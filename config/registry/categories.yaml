# Company categories — each company has exactly one primary_category.
# These represent hiring ecosystems, not tech classifications.

categories:
  indian_product:
    label: Indian Product Company
    description: Homegrown product companies (PhonePe, Groww, Meesho, Flipkart, Swiggy, etc.)
  gcc:
    label: Global Capability Center
    description: Captive R&D/IT centers of global corporations in India
  mnc:
    label: Multinational Corporation
    description: Large global tech corporations with India offices
  service:
    label: IT Services
    description: IT services and consulting firms (TCS, Infosys, Wipro, Accenture, etc.)
  startup:
    label: Startup
    description: Early to growth-stage startups (<500 employees)
  remote:
    label: Remote-First
    description: Companies with remote-first or distributed work culture
  yc:
    label: Y Combinator
    description: Y Combinator-backed companies
  fintech:
    label: FinTech
    description: Financial technology companies
  edtech:
    label: EdTech
    description: Education technology companies
  healthtech:
    label: HealthTech
    description: Healthcare technology companies
  devtools:
    label: Developer Tools
    description: Developer tooling and infrastructure
  government:
    label: Government / PSU
    description: Government IT departments and public sector units
