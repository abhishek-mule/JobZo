# ── Company Registry ──────────────────────────────────────────────────────────
# Identity only: what a company IS, not what it's doing right now.
#
# Identity fields:
#   name                - Display name
#   category            - One of categories.yaml (hiring ecosystem)
#   ats                 - Primary ATS name (matches ats_profiles table)
#   careers_url         - Human-friendly careers page
#   job_listing_url     - Machine-friendly job listing URL (optional override)
#   fresher_friendly    - Known to hire freshers (<2yr experience)
#   graduate_roles      - Explicitly runs graduate/ campus hiring programs
#   internship          - Offers internship programs
#   remote_policy       - Remote | Hybrid | On-site (optional)
#   poll_interval_hours - How often to poll (default 24)
#   tags                - Free-form keywords for discovery/filtering
#
# Registry provenance:
#   status              - active | paused | broken | archived (default active)
#   registry_source     - manual | wellfound | yc | csv | community | college | github (default manual)
#   registry_quality    - verified | community | auto_discovered | deprecated (default manual)
#
# Hiring channels (optional - for companies with multiple hiring pipelines):
#   hiring_channels:
#     channel_name:
#       url:            - Machine-friendly URL for this channel
#       ats:            - ATS for this channel (overrides company default)
#       fresher_friendly: true
#       graduate_roles: true

